[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumeta-agent"
version = "2.0.0"
description = "Agente modular para recepção, interpretação estruturada, memória de sessão e roteamento de solicitações."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.30.0", "python-dotenv>=1.0.0", "pyyaml>=6.0.1"]

[project.scripts]
lumeta = "lumeta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
