agent:
  name: Lumeta
  version: "2.0.0"
  language: "pt-BR"
  description: "Agente modular para recepção, interpretação estruturada, memória e roteamento de solicitações."

intents:
  - id: suporte_tecnico
    description: "Erros, bugs, falhas de acesso, lentidão ou instabilidade técnica."
  - id: financeiro
    description: "Faturas, cobranças, reembolsos, notas fiscais, boletos ou pagamentos."
  - id: comercial
    description: "Orçamentos, planos, demonstrações, upgrades ou contratação de serviços."
  - id: agendamento
    description: "Marcar, remarcar ou cancelar reuniões, consultas ou atendimentos."
  - id: cancelamento
    description: "Pedidos de cancelamento de conta, serviço ou assinatura."
  - id: informacao_geral
    description: "Dúvidas gerais, status, políticas ou informações institucionais."
  - id: desconhecido
    description: "Solicitações ambíguas ou fora do escopo mapeado."

priorities:
  - baixa
  - media
  - alta
  - critica

sentiments:
  - positivo
  - neutro
  - negativo
  - frustrado
